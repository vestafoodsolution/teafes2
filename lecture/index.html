<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="index,follow">
<title>萬茶盛典 II 講座時間表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&amp;family=Noto+Serif+TC:wght@400;600;700&amp;display=swap">
<style>
:root{
  --ink:#1C1B18;--cream:#F4EFE6;--paper:#FBF8F1;--khaki:#E8DFCE;--card:#DED2B8;
  --band:#ECE4D6;--mi:#564E42;
  --gold:#9C7A3C;--gold-deep:#85672F;--teal:#2F5A5B;
  --muted:#7A7263;--muted-dark:#3A362E;--on-dark:#B9AF9B;--on-dark-faint:#7A7263;
  --wrap:1200px;--lab:120px;
  --serif:"Noto Serif TC","Songti TC",serif;--sans:"Noto Sans TC","PingFang TC",sans-serif;
}
html{color-scheme:light;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--muted-dark);font-family:var(--sans);
  font-size:15px;line-height:1.65;overflow-x:hidden}
img,svg{max-width:100%}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 16px}
@media(min-width:820px){.wrap{padding:0 24px}}

/* 頁首（墨底） */
.phead{background:var(--ink);padding:24px 0 22px;position:relative}
.phead .brand{font-family:var(--serif);color:var(--cream);font-size:21px;
  letter-spacing:.16em;font-weight:700;line-height:1.3}
.phead .bsub{font-size:10px;letter-spacing:.3em;color:var(--gold);margin-top:7px;
  text-transform:uppercase}
.phead h1{font-family:var(--serif);color:var(--cream);font-weight:600;line-height:1.35;
  font-size:22px;margin:20px 0 7px}
@media(min-width:820px){.phead h1{font-size:30px}}
.phead .dates{font-size:13px;color:var(--on-dark)}
.langs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
@media(min-width:820px){.langs{position:absolute;top:24px;right:24px;margin:0}}
.langs button{font-family:var(--sans);font-size:12px;letter-spacing:.04em;cursor:pointer;
  background:transparent;border:1px solid rgba(255,255,255,.26);color:var(--on-dark);
  padding:5px 11px;border-radius:2px}
.langs button[aria-pressed="true"]{border-color:var(--gold);color:var(--cream)}

/* 日期分頁（黏頂） */
.daybar{position:sticky;top:0;z-index:30;background:var(--cream);
  border-bottom:1px solid var(--card)}
.daybar .in{display:flex;max-width:var(--wrap);margin:0 auto;padding:0 8px}
@media(min-width:820px){.daybar .in{padding:0 24px}}
.daybar button{flex:1 1 0;min-width:0;background:transparent;border:0;cursor:pointer;
  border-bottom:2px solid transparent;padding:13px 4px;font-family:var(--sans);
  font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daybar button[aria-selected="true"]{color:var(--ink);font-weight:500;
  border-bottom-color:var(--gold)}

/* 切換另一份時間表（兩顆方塊，刻意不做成底線頁籤，才不會跟日期頁籤混淆） */
.switch{background:var(--cream);padding:14px 0 0}
.switch .in{display:flex;gap:8px;max-width:var(--wrap);margin:0 auto;padding:0 16px}
.sw{flex:1 1 0;min-width:0;text-align:center;padding:11px 8px;border-radius:3px;
  border:1px solid var(--card);background:var(--paper);color:var(--muted-dark);
  font-size:13.5px;line-height:1.3;text-decoration:none;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sw[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--cream);
  font-weight:500}
.sw:not([aria-current]):hover{border-color:var(--gold);color:var(--gold-deep)}
@media(min-width:820px){
  .switch .in{padding:0 24px;justify-content:flex-start}
  .sw{flex:0 0 auto;min-width:210px;padding:11px 22px}
}
.otherlink{text-align:center;margin:20px 0 0}
.otherlink a{font-size:14px;color:var(--gold-deep);text-decoration:none;
  border-bottom:1px solid var(--card);padding-bottom:3px}
.otherlink a:hover{border-bottom-color:var(--gold)}

main{padding-bottom:8px}
.bandnote{background:var(--khaki);border:1px solid var(--card);border-radius:3px;
  padding:10px 13px;font-size:13px;line-height:1.6;color:var(--muted-dark);margin:18px 0 14px}

/* 電腦橫式時間軸 / 手機直式清單 切換 */
.board{display:none}
.list{display:block}
@media(min-width:820px){.board{display:block}.list{display:none}}

.board{position:relative;margin:4px 0 6px}
.layer{position:absolute;left:var(--lab);right:0;top:20px;bottom:0;z-index:0;
  pointer-events:none;overflow:hidden}
.layer .bd{position:absolute;top:0;bottom:0;background:var(--band)}
.layer .gl{position:absolute;inset:0;opacity:.75;
  background-image:repeating-linear-gradient(to right,var(--card) 0 1px,transparent 1px 12.5%)}
.rows{position:relative;z-index:1}
.thead{display:grid;grid-template-columns:var(--lab) 1fr;position:relative;z-index:1}
.ticks{position:relative;height:20px}
.ticks span{position:absolute;top:0;font-size:11px;color:var(--muted);white-space:nowrap;
  transform:translateX(-50%)}
.ticks span.f{transform:none;left:0}
.ticks span.l{transform:none;left:auto;right:0}
.row{display:grid;grid-template-columns:var(--lab) 1fr;border-top:1px solid var(--card)}
.rows .row:last-child{border-bottom:1px solid var(--card)}
.rlab{display:flex;align-items:center;overflow:hidden;padding:10px 12px 10px 0;
  border-right:1px solid var(--card)}
.rlab span{font-family:var(--serif);font-size:13px;line-height:1.35;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--cc);
  padding-left:9px}
.track{position:relative;padding:7px 0}
.card{position:absolute;overflow:hidden;background:var(--fl);border:1px solid var(--eg);
  border-left:3px solid var(--cc);border-radius:3px;padding:5px 7px;max-width:100%}
.card .sp{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ti{font-size:12px;color:var(--tx);line-height:1.3;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-height:2.6em}
.card .mt{font-size:11px;color:var(--mi);line-height:1.35;margin-top:2px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}

/* 手機直式清單 */
.lcard{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start;
  background:var(--fl);border:1px solid var(--eg);border-left:3px solid var(--cc);
  border-radius:3px;padding:11px 12px;margin:8px 0}
.lcard>div{min-width:0}
.lt b{display:block;font-family:var(--serif);font-size:17px;line-height:1.15;color:var(--ink)}
.lt i{display:block;font-style:normal;font-size:12px;color:var(--mi);margin-top:2px}
.tag{display:inline-block;font-size:11px;line-height:1.5;color:var(--tx);
  background:var(--tg);border:1px solid var(--eg);border-radius:2px;padding:0 6px;
  margin-bottom:4px}
.sp2{font-size:14px;font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.ti2{font-size:14px;color:var(--tx);margin-top:1px;overflow-wrap:anywhere}
.vn2{font-size:12px;color:var(--mi);margin-top:3px;overflow-wrap:anywhere}
.nt2{display:inline-block;font-size:11px;font-weight:700;line-height:1.6;color:var(--muted-dark);
  background:var(--tg);border:1px solid var(--eg);border-radius:2px;padding:0 5px;
  margin-top:5px}
.blk{background:var(--band);border:1px solid var(--card);border-radius:3px;
  padding:9px 9px 11px;margin:12px 0}
.blk h3{margin:0 0 1px;font-family:var(--sans);font-weight:500;font-size:11px;
  letter-spacing:.06em;color:var(--muted-dark)}
.blk .lcard{margin:7px 0 0}

/* 購票鈕與小字 */
.cta-wrap{text-align:center;margin:30px 0 0}
.cta{display:inline-block;font-family:var(--sans);font-size:16px;letter-spacing:.08em;
  text-decoration:none;border:0;border-radius:2px;padding:15px 44px;cursor:pointer;
  background:var(--gold);color:var(--cream);max-width:100%}
.cta:hover{background:var(--gold-deep)}
.cta.off{background:var(--card);color:var(--muted-dark);cursor:default;pointer-events:none}
.meta{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 0}
.note2{text-align:center;font-size:12px;color:var(--muted-dark);margin:4px 0 36px}

/* 頁尾 */
.site-foot{background:var(--ink);color:var(--on-dark)}
.foot-in{max-width:var(--wrap);margin:0 auto;padding:52px 20px 38px;text-align:center}
.foot-brand{font-family:var(--serif);color:var(--cream);font-size:22px;letter-spacing:.22em;
  font-weight:700;line-height:1.3}
.foot-brand small{display:block;font-family:var(--sans);font-weight:300;font-size:10px;
  letter-spacing:.4em;color:var(--gold);margin-top:7px}
.foot-orgs{font-size:13px;line-height:2.1;margin:24px 0}
.foot-orgs b{color:var(--cream);font-weight:500;margin-right:8px}
.foot-orgs a{color:var(--on-dark);text-decoration:none}
.foot-orgs a:hover{color:var(--cream)}
.foot-social{display:flex;justify-content:center;flex-wrap:wrap;gap:12px 24px;font-size:13px;
  letter-spacing:.14em;margin-top:8px}
.foot-social a{color:var(--on-dark);text-decoration:none}
.foot-social a:hover{color:var(--cream)}
.copyright{font-size:12px;color:var(--on-dark-faint);margin-top:26px}
</style>
</head>

const T0 = 600, T1 = 1080;            // 時間軸 10:00–18:00（分鐘）
const SPAN = T1 - T0, HOURS = 8;
const CARD_H = 88, CARD_GAP = 6;

function mins(hm){ const p = hm.split(":"); return (+p[0]) * 60 + (+p[1]); }
function pct(v){ return (Math.round(v * 1000) / 1000) + "%"; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

let LANG = CFG.defaultLang, DAY = "1211";

function ui(k){
  const o = I18N.ui[k]; if(!o) return k;
  return o[LANG] || o[CFG.defaultLang] || o[Object.keys(o)[0]] || k;
}
function dayLabel(dk){
  const o = I18N.ui.day[dk] || {};
  return o[LANG] || o[CFG.defaultLang] || dk;
}
function tx(section, key){
  const m = I18N[section], o = m && m[key];
  if(o && o[LANG]) return o[LANG];
  return key;                           // 查不到翻譯就顯示中文原文
}
function hhmm(m){
  const h = Math.floor(m / 60), x = m % 60;
  return h + ":" + (x < 10 ? "0" + x : x);
}

/* 依開始時間排序後把時間重疊的場次併成同一「時段帶」。
   mutual：新場次要與帶內「每一場」都重疊才併入（帶內兩兩真的衝突）。
   chain ：只要與帶尾重疊就併入（規格原文寫法）。 */
function makeBands(items){
  const out = [];
  const mutual = CFG.bandMode === "mutual";
  let cur = null;
  items.forEach(function(it){
    if(cur && it._s < (mutual ? cur.minE : cur.e)){
      cur.items.push(it);
      cur.e = Math.max(cur.e, it._e);
      cur.minE = Math.min(cur.minE, it._e);
    } else {
      cur = { s: it._s, e: it._e, minE: it._e, items: [it] };
      out.push(cur);
    }
  });
  return out;
}
/* 同類別內時間重疊的場次自動分多道堆疊 */
function makeLanes(items){
  const lanes = [];
  items.forEach(function(it){
    for(let i = 0; i < lanes.length; i++){
      if(lanes[i][lanes[i].length - 1]._e <= it._s){ lanes[i].push(it); it._lane = i; return; }
    }
    it._lane = lanes.length; lanes.push([it]);
  });
  return lanes.length || 1;
}

function dayItems(dk){
  const a = DATA.filter(x => x.dayKey === dk).map(function(x){
    const o = Object.assign({}, x);
    o._s = mins(x.s); o._e = mins(x.e);
    return o;
  });
  a.sort((p, q) => p._s - q._s || p._e - q._e);
  return a;
}

/* 一張卡片要用到的四個色：主色（左緣）、卡片底、邊框、講題字 */
function tintVars(cat){
  const t = CFG.tint[cat];
  return "--cc:" + t.cc + ";--fl:" + t.fill + ";--eg:" + t.edge
       + ";--tx:" + t.txt + ";--tg:" + t.tag;
}

function metaLine(it){
  // 第一行永遠是名稱（講者，沒講者就用場次名），時間與地點一律放這行；備註（現場劃位）加粗
  let s = esc(hhmm(it._s) + "–" + hhmm(it._e) + " · " + tx("venue", it.venue));
  if(it.note) s += " · <b>" + esc(tx("note", it.note)) + "</b>";
  return s;
}

/* ---- 電腦：橫式時間軸 ---- */
function renderBoard(items){
  const normal = items.filter(x => !x.allday);
  const allday = items.filter(x => x.allday);
  const left = (m) => (Math.max(T0, Math.min(T1, m)) - T0) / SPAN * 100;

  let bands = "";
  const bs = makeBands(normal);
  bs.forEach(function(b, i){
    if(i % 2) return;                     // 奇數帶鋪淡底、偶數帶不鋪（由 0 起算）
    // mutual 模式的帶在時間上可能相鄰重疊，淡底改以「下一帶起點」收邊，避免色塊互疊
    const end = (CFG.bandMode === "mutual" && bs[i + 1])
      ? Math.min(bs[i + 1].s, b.e) : b.e;
    const l = left(b.s), w = left(end) - l;
    if(w > 0){
      bands += '<div class="bd" style="left:' + pct(l) + ';width:' + pct(w) + '"></div>';
    }
  });

  let ticks = "";
  for(let h = 0; h <= HOURS; h++){
    const cls = h === 0 ? " f" : (h === HOURS ? " l" : "");
    ticks += '<span class="' + cls.trim() + '" style="left:' + pct(h / HOURS * 100) + '">'
          + (10 + h) + ":00</span>";
  }

  let rows = "";
  CFG.cats.forEach(function(cat){
    // 全日場次（九座茶島）也畫成一般卡片，照自己的起訖時間擺，與元茶三韻一致
    const list = items.filter(x => x.cat === cat);
    if(!list.length) return;
    const lanes = makeLanes(list);
    const h = lanes * CARD_H + (lanes - 1) * CARD_GAP;
    let cards = "";
    list.forEach(function(it){
      const l = left(it._s), w = Math.max(left(it._e) - l, 2.6);
      cards += '<div class="card" style="' + tintVars(cat) + ';left:' + pct(l)
        + ';width:' + pct(w) + ';top:' + (it._lane * (CARD_H + CARD_GAP)) + 'px;height:'
        + CARD_H + 'px">'
        + '<div class="sp">' + esc(it.speaker || tx("title", it.title)) + "</div>"
        + (it.speaker ? '<div class="ti">' + esc(tx("title", it.title)) + "</div>" : "")
        + '<div class="mt">' + metaLine(it) + "</div></div>";
    });
    rows += '<div class="row"><div class="rlab"><span style="--cc:' + CFG.tint[cat].cc + '">'
      + esc(tx("cat", cat)) + '</span></div><div class="track" style="height:'
      + (h + 14) + 'px">' + cards + "</div></div>";
  });

  return '<div class="layer">' + bands + '<div class="gl"></div></div>'
    + '<div class="thead"><div></div><div class="ticks">' + ticks + "</div></div>"
    + '<div class="rows">' + rows + "</div>";
}

/* ---- 手機：直式清單 ---- */
function lcard(it){
  return '<div class="lcard" style="' + tintVars(it.cat) + '"><div class="lt"><b>'
    + esc(hhmm(it._s)) + "</b><i>" + esc(hhmm(it._e)) + "</i></div><div>"
    + '<span class="tag">' + esc(tx("cat", it.cat)) + "</span>"
    + '<div class="sp2">' + esc(it.speaker || tx("title", it.title)) + "</div>"
    + (it.speaker ? '<div class="ti2">' + esc(tx("title", it.title)) + "</div>" : "")
    + '<div class="vn2">' + esc(ui("venue")) + " · " + esc(tx("venue", it.venue)) + "</div>"
    + (it.note ? '<span class="nt2">' + esc(tx("note", it.note)) + "</span>" : "")
    + "</div></div>";
}
function renderList(items){
  const normal = items.filter(x => !x.allday);
  let out = "";
  // 全日場次（九座茶島）排在最前面，但格式與其他場次相同，左欄一樣有起訖時間
  items.filter(x => x.allday).forEach(function(it){ out += lcard(it); });
  makeBands(normal).forEach(function(b){
    const cards = b.items.map(lcard).join("");
    if(b.items.length > 1){
      out += '<div class="blk"><h3>' + esc(ui("chooseOne")) + "</h3>" + cards + "</div>";
    } else { out += cards; }
  });
  return out;
}

function setHash(){
  const h = "#" + DAY + (CFG.langs.length > 1 ? "-" + LANG : "");
  if(location.hash !== h){
    try { history.replaceState(null, "", h); } catch(e){ location.hash = h; }
  }
  try { localStorage.setItem("wancha-sched-lang", LANG); } catch(e){}
}

function render(){
  const d = document;
  d.documentElement.lang = CFG.htmlLang[LANG] || "zh-Hant";
  d.getElementById("brand").textContent = ui("brand");
  d.getElementById("bsub").textContent = ui("brandSub");
  d.getElementById("ptitle").textContent = ui(CFG.titleKey);
  d.getElementById("pdates").textContent = ui("dates");
  d.getElementById("bandnote").textContent = ui("bandNote");
  CFG.days.forEach(function(dk){
    const b = d.getElementById("tab-" + dk);
    b.textContent = dayLabel(dk);
    b.setAttribute("aria-selected", dk === DAY ? "true" : "false");
  });
  const items = dayItems(DAY);
  d.getElementById("board").innerHTML = renderBoard(items);
  d.getElementById("list").innerHTML = renderList(items);

  const cta = d.getElementById("ticketBtn");
  if(TICKET_URL){
    cta.textContent = ui("ticket");
    cta.className = "cta";
    cta.setAttribute("href", TICKET_URL);
    cta.setAttribute("target", "_blank");
    cta.setAttribute("rel", "noopener");
    cta.removeAttribute("aria-disabled");
  } else {
    cta.textContent = ui("ticketSoon");
    cta.className = "cta off";
    cta.removeAttribute("href");
    cta.setAttribute("aria-disabled", "true");
  }
  // 切換到另一份時間表時，把目前看的那一天（三語版再加語言）帶過去
  const hash = "#" + DAY + (CFG.langs.length > 1 ? "-" + LANG : "");
  const cur = d.getElementById("curTop");
  if (cur) cur.textContent = ui(CFG.selfShortKey);
  ["otherTop", "otherBottom"].forEach(function(id){
    const a = d.getElementById(id);
    if (a) {
      a.setAttribute("href", CFG.otherBase + hash);
      a.textContent = (id === "otherTop") ? ui(CFG.otherShortKey) : ui("otherLink");
    }
  });

  d.getElementById("updated").textContent = ui("updated") + " " + CFG.updated;
  d.getElementById("disclaimer").textContent = ui("disclaimer");

  d.getElementById("footOrg").textContent = ui("footOrganizer");
  d.getElementById("footOrgName").textContent = ui("footOrganizerName");
  d.getElementById("footExe").textContent = ui("footExecutor");
  d.getElementById("footExeName").textContent = ui("footExecutorName");
  d.getElementById("footCopy").textContent = ui("copyright");
  if(CFG.langs.length > 1){
    CFG.langs.forEach(function(l){
      const b = d.getElementById("lang-" + l);
      if(b) b.setAttribute("aria-pressed", l === LANG ? "true" : "false");
    });
  }
  setHash();
}

function todayKey(){
  // 台灣時間（UTC+8）的今天；活動期間開頁自動跳到當天
  const n = new Date(Date.now() + (8 * 60 + new Date().getTimezoneOffset()) * 60000);
  const m = n.getMonth() + 1, d = n.getDate();
  if(n.getFullYear() === 2026 && m === 12 && d >= 11 && d <= 13){ return "12" + d; }
  return null;
}

function boot(){
  let lang = null, day = null;
  const h = (location.hash || "").replace(/^#/, "").split("-");
  if(h[0] && CFG.days.indexOf(h[0]) >= 0) day = h[0];
  if(h[1] && CFG.langs.indexOf(h[1]) >= 0) lang = h[1];
  if(!lang){
    try {
      const v = localStorage.getItem("wancha-sched-lang");
      if(v && CFG.langs.indexOf(v) >= 0) lang = v;
    } catch(e){}
  }
  LANG = lang || CFG.defaultLang;
  DAY = day || todayKey() || CFG.days[0];

  CFG.days.forEach(function(dk){
    document.getElementById("tab-" + dk).addEventListener("click", function(){
      DAY = dk; render();
    });
  });
  CFG.langs.forEach(function(l){
    const b = document.getElementById("lang-" + l);
    if(b) b.addEventListener("click", function(){ LANG = l; render(); });
  });
  window.addEventListener("hashchange", function(){
    const p = (location.hash || "").replace(/^#/, "").split("-");
    let ch = false;
    if(p[0] && CFG.days.indexOf(p[0]) >= 0 && p[0] !== DAY){ DAY = p[0]; ch = true; }
    if(p[1] && CFG.langs.indexOf(p[1]) >= 0 && p[1] !== LANG){ LANG = p[1]; ch = true; }
    if(ch) render();
  });
  render();
}
boot();
